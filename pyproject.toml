[project]
name = "jetsuite2"
version = "0.1.0"
description = "Multi-fidelity micro-turbojet design suite (single-spool, centrifugal compressor) with parametric CAD"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "cadquery==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jet = "jetsuite2.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
